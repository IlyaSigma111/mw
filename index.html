<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12121A">
  <title>МедиаволнApp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <!-- Firebase SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <!-- VK Bridge -->
  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
  <!-- Feather Icons -->
  <script src="https://unpkg.com/feather-icons"></script>
</head>
<body>
  <div id="toasts"></div>

  <div class="shell">
    <!-- Шапка: аватар, имя, баллы -->
    <header class="hdr rise">
      <div id="hdr-avatar" class="hdr-avatar"></div>
      <div id="hdr-name" class="hdr-name"><span>…</span></div>
      <div class="hdr-score"><span id="score-num">0</span></div>
    </header>

    <!-- Расписание -->
    <section class="sec rise rise-1">
      <div class="sec-head">
        <i data-feather="calendar"></i>
        <h2>Расписание</h2>
        <button id="sched-refresh" class="link-btn" type="button" style="margin-left:auto" title="Обновить из админки">Обновить</button>
      </div>
      <div id="schedule">
        <div class="skel h18"></div><div class="skel h18"></div><div class="skel h18"></div>
      </div>
    </section>

    <!-- Рейтинг -->
    <section class="sec rise rise-2">
      <div class="sec-head">
        <i data-feather="award"></i>
        <h2>Рейтинг</h2>
      </div>
      <div class="sec-sub">Топ-10 · обновляется автоматически</div>
      <div id="rating">
        <div class="skel h18"></div><div class="skel h18"></div><div class="skel h18"></div>
      </div>
    </section>

    <!-- Задания -->
    <section class="sec rise rise-3">
      <div class="sec-head">
        <i data-feather="zap"></i>
        <h2>Задания</h2>
      </div>
      <div class="sec-sub">Выполняй и получай баллы</div>
      <div id="tasks"></div>
    </section>
  </div>

  <!-- Тестовая кнопка +1 балл (в финале можно скрыть) -->
  <button id="plus-one" class="fab" type="button">+1 балл</button>

  <script src="js/firebase-config.js"></script>
  <script src="js/schedule.js"></script>
  <script src="js/vk.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
