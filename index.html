<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12121A">
  <title>МедиаволнApp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <!-- Firebase SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <!-- VK Bridge -->
  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
  <!-- Feather Icons -->
  <script src="https://unpkg.com/feather-icons"></script>
</head>
<body>
  <div id="toasts"></div>

  <div class="shell">
    <!-- Верхняя панель — на уровне шапки VK (крестик / ⋯ справа вверху) -->
    <header class="appbar">
      <span class="appbar-logo"><i data-feather="activity"></i> МедиаволнApp</span>
      <button id="btn-admin" class="appbar-admin" type="button" title="Админ-панель">
        <i data-feather="settings"></i>
      </button>
    </header>

    <!-- Шапка участника: аватар, имя, баллы -->
    <header class="hdr rise">
      <div id="hdr-avatar" class="hdr-avatar"></div>
      <div id="hdr-name" class="hdr-name"><span>…</span></div>
      <div class="hdr-score"><span id="score-num">0</span></div>
    </header>

    <!-- РАСПИСАНИЕ (открыто по умолчанию) -->
    <section class="sec tab-pane app-pane rise rise-1 active" data-tab="schedule">
      <div class="sec-head">
        <i data-feather="calendar"></i>
        <h2>Расписание</h2>
        <button id="sched-refresh" class="link-btn" type="button" style="margin-left:auto" title="Обновить из админки">Обновить</button>
      </div>
      <div id="schedule">
        <div class="skel h18"></div><div class="skel h18"></div><div class="skel h18"></div>
      </div>
    </section>

    <!-- ЗАДАНИЯ -->
    <section class="sec tab-pane app-pane rise rise-2" data-tab="tasks">
      <div class="sec-head">
        <i data-feather="zap"></i>
        <h2>Задания</h2>
      </div>
      <div class="sec-sub">Выполняй и получай баллы</div>
      <div id="tasks"></div>
    </section>

    <!-- РЕЙТИНГ -->
    <section class="sec tab-pane app-pane rise rise-3" data-tab="rating">
      <div class="sec-head">
        <i data-feather="award"></i>
        <h2>Рейтинг</h2>
      </div>
      <div class="sec-sub">Топ-10 · обновляется автоматически</div>
      <div id="rating">
        <div class="skel h18"></div><div class="skel h18"></div><div class="skel h18"></div>
      </div>
    </section>
  </div>

  <!-- Докбар: Расписание · Задания · Рейтинг -->
  <nav class="dock">
    <button class="dock-item on" data-tab="schedule" type="button">
      <i data-feather="calendar"></i><span>Расписание</span>
    </button>
    <button class="dock-item" data-tab="tasks" type="button">
      <i data-feather="zap"></i><span>Задания</span>
    </button>
    <button class="dock-item" data-tab="rating" type="button">
      <i data-feather="award"></i><span>Рейтинг</span>
    </button>
  </nav>

  <script src="js/firebase-config.js"></script>
  <script src="js/schedule.js"></script>
  <script src="js/vk.js"></script>
  <script src="js/app.js"></script>
  <script>
    /* Вход в админку по deep-link: ...vk.com/app54716297#admin */
    (function () {
      var hash = location.hash || '';
      var deeplink = '';
      try { deeplink = new URLSearchParams(location.search).get('vk_deeplink') || ''; } catch (e) {}
      if (hash.indexOf('admin') >= 0 || deeplink.indexOf('admin') >= 0) {
        location.replace('admin.html' + location.search);
      }
    })();
  </script>
</body>
</html>
