<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>МедиаволнApp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=29">
  
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="js/vk-bridge.js"></script>
  <script>
    if (typeof vkBridge !== 'undefined') {
      vkBridge.send('VKWebAppInit').catch(function() {});
    }
  </script>
  <script src="https://unpkg.com/feather-icons"></script>
</head>
<body>
  <div id="toasts"></div>

  <div class="mobile-wrapper">
    <!-- Инновационный плавающий заголовок (Sticky Header) -->
    <header class="top-nav">
      <div class="user-pill rise">
        <div id="hdr-avatar" class="pill-avatar"></div>
        <div class="pill-info">
          <div id="hdr-name" class="pill-name">Загрузка...</div>
          <div class="pill-role">Участник слёта</div>
        </div>
        <div class="pill-score">
          <span id="score-num">0</span> <i data-feather="zap"></i>
        </div>
      </div>
    </header>

    <main class="main-content">
      <!-- РАСПИСАНИЕ -->
      <section class="app-pane active" data-tab="schedule">
        <div class="page-header rise">
          <div class="page-header-text">
            <h1 class="gradient-text">Расписание</h1>
            <p>Ваши события на сегодня</p>
          </div>
          <button id="sched-refresh" class="action-btn" type="button"><i data-feather="refresh-cw"></i></button>
        </div>
        <div id="schedule" class="bento-grid rise rise-1">
          <!-- Скелетоны -->
          <div class="skel h18"></div><div class="skel h18"></div>
        </div>
      </section>

      <!-- ЗАДАНИЯ -->
      <section class="app-pane" data-tab="tasks">
        <div class="page-header rise">
          <div class="page-header-text">
            <h1 class="gradient-text">Активности</h1>
            <p>Выполняйте задания и получайте баллы</p>
          </div>
        </div>
        <div id="tasks" class="task-list rise rise-1"></div>
      </section>

      <!-- РЕЙТИНГ -->
      <section class="app-pane" data-tab="rating">
        <div class="page-header rise">
          <div class="page-header-text">
            <h1 class="gradient-text">Лидерборд</h1>
            <p>Топ участников Медиаволны</p>
          </div>
          <button id="rating-refresh" class="action-btn" type="button"><i data-feather="refresh-cw"></i></button>
        </div>
        <div id="rating" class="rating-list rise rise-1">
          <div class="skel h18"></div><div class="skel h18"></div>
        </div>
        <div id="district-rating" class="rating-list rise rise-2" style="margin-top: 24px;"></div>
      </section>

      <!-- НАСТРОЙКИ -->
      <section class="app-pane" data-tab="settings">
        <div class="page-header rise">
          <div class="page-header-text">
            <h1 class="gradient-text">Профиль</h1>
            <p>Управление настройками</p>
          </div>
        </div>
        <div class="bento-card rise rise-1">
          <div class="set-row" data-set="vibe" role="button" tabindex="0">
            <div class="set-icon"><i data-feather="smartphone"></i></div>
            <div class="grow"><b>Вибрация</b><small>Тактильный отклик</small></div>
            <div class="sw"><i></i></div>
          </div>
          <div class="set-divider"></div>
          <div class="set-row" data-set="sound" role="button" tabindex="0">
            <div class="set-icon"><i data-feather="volume-2"></i></div>
            <div class="grow"><b>Звуки</b><small>Сигналы на действия</small></div>
            <div class="sw"><i></i></div>
          </div>
        </div>
        
        <div class="bento-card rise rise-2" style="margin-top: 16px;">
          <div class="set-row" id="set-district-row" role="button" tabindex="0">
            <div class="set-icon accent-icon"><i data-feather="map-pin"></i></div>
            <div class="grow"><b>Ваш округ</b><small id="set-district-val">не выбран</small></div>
            <div class="chevron"><i data-feather="chevron-right"></i></div>
          </div>
          <div class="set-row" id="set-rating-row" style="display:none; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 16px; margin-top: 16px;" role="button" tabindex="0">
            <div class="set-icon"><i data-feather="eye"></i></div>
            <div class="grow"><b>Показ в топе</b><small>Видимость для всех</small></div>
            <div class="sw"><i></i></div>
          </div>
        </div>

        <div id="admin-entry" style="display:none; margin-top: 24px;" class="rise rise-3">
          <button id="btn-admin-open" class="btn-primary" type="button">
            <i data-feather="shield"></i> Панель администратора
          </button>
        </div>
      </section>
    </main>

    <!-- Изящный мобильный докбар -->
    <nav class="dock-nav">
      <button class="dock-item on" data-tab="schedule" type="button">
        <i data-feather="calendar"></i>
        <span>План</span>
      </button>
      <button class="dock-item" data-tab="tasks" type="button">
        <i data-feather="zap"></i>
        <span>Задания</span>
      </button>
      <button class="dock-item" data-tab="rating" type="button">
        <i data-feather="award"></i>
        <span>Рейтинг</span>
      </button>
      <button class="dock-item" data-tab="settings" type="button">
        <i data-feather="user"></i>
        <span>Профиль</span>
      </button>
    </nav>
  </div>

  <script src="js/firebase-config.js?v=29"></script>
  <script src="js/districts.js?v=29"></script>
  <script src="js/schedule.js?v=29"></script>
  <script src="js/vk.js?v=29"></script>
  <script src="js/app.js?v=29"></script>
  <script>
    (function () {
      var hash = location.hash || '';
      var deeplink = '';
      try { deeplink = new URLSearchParams(location.search).get('vk_deeplink') || ''; } catch (e) {}
      if (hash.indexOf('admin') >= 0 || deeplink.indexOf('admin') >= 0) {
        location.replace('admin.html' + location.search);
      }
    })();
  </script>
</body>
</html>
